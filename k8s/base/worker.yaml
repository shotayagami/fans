# Solid Queue worker: processes Stripe webhook events (StripeEventJob).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fans-worker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fans-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fans-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: fans
          command: [ "./bin/jobs" ]
          envFrom:
            - configMapRef:
                name: fans-config
            - secretRef:
                name: fans-secret
          env:
            - name: FANS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fans-pg-app
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          volumeMounts:
            - name: tmp
              mountPath: /rails/tmp
            - name: systmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 192Mi
            limits:
              memory: 384Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: systmp
          emptyDir: {}
