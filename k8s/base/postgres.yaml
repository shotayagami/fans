# One instance is enough: the demo holds Stripe test-mode data only, so it is not
# in the Velero or per-DB backup rotation (see README).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fans-pg
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.12-202611122305-system-trixie@sha256:6b8f23131e02fb4f2765fd1c7f9bca1c09a0b8b5aa90d69a3c5e8e5c60fa3d76
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: fans_production
      owner: fans
  postgresql:
    parameters:
      shared_buffers: 64MB
  storage:
    storageClass: longhorn
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi
---
# Solid Queue keeps its tables in a second database (config/database.yml: queue).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: fans-queue
spec:
  cluster:
    name: fans-pg
  name: fans_production_queue
  owner: fans
