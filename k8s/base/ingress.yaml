# Public host only. TLS ends at the Cloudflare edge and the tunnel reaches
# ingress-nginx with noTLSVerify, so no cert-manager entry is needed.
# No Cloudflare Access: reviewers and Stripe webhooks must reach it unauthenticated.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fans
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
spec:
  # 2026-11 ingress-nginx を外し、rke2-traefik の kubernetesIngressNGINX provider が読むクラスに変えた (shotayagami/homelab-infra#1061)。
  ingressClassName: rke2-ingress-nginx-migration
  rules:
    - host: fans.yagamin.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fans-web
                port:
                  number: 80
